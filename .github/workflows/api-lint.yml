# Ejecuta ESLint del API en cada PR y push a main: la regla no-floating-promises solo protege si se aplica siempre.
name: API lint

on:
  pull_request:
    paths:
      - 'apps/api/**'
      - '.github/workflows/api-lint.yml'
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - '.github/workflows/api-lint.yml'

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -p tsconfig.eslint.json
