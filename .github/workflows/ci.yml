# CI del repositorio: valida el frontend (lint y build) y el API (lint, tsc, build y pruebas unitarias)
# en cada PR y en cada push a main. El job `api-e2e` levanta Postgres y SeaweedFS efímeros, aplica las
# migraciones con dbmate y ejecuta las pruebas e2e del API.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (lint y build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint:web
      - run: npm run build:web

  api:
    name: API (lint, build y pruebas)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -p tsconfig.eslint.json
      - run: npm run build
      - run: npm test

  api-e2e:
    name: API (pruebas e2e)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nexus_e2e
          POSTGRES_USER: nexus_e2e
          POSTGRES_PASSWORD: nexus_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexus_e2e -d nexus_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      # Secretos efímeros solo para esta ejecución: no se guardan en el repositorio.
      - name: Generar credenciales de prueba
        run: |
          {
            echo "JWT_SECRET=$(openssl rand -hex 32)"
            echo "FILES_MASTER_KEY=$(openssl rand -base64 32)"
            echo "S3_ACCESS_KEY=e2e$(openssl rand -hex 8)"
            echo "S3_SECRET_KEY=$(openssl rand -hex 24)"
            echo "WEED_JWT_FILER_SIGNING_KEY=$(openssl rand -hex 32)"
          } >> "$GITHUB_ENV"

      # Misma imagen (con digest fijado) y mismos parámetros que el servicio seaweedfs de docker-compose.yml.
      - name: Levantar SeaweedFS (S3)
        run: |
          docker run -d --name seaweedfs -p 8333:8333 \
            -e AWS_ACCESS_KEY_ID="$S3_ACCESS_KEY" \
            -e AWS_SECRET_ACCESS_KEY="$S3_SECRET_KEY" \
            -e WEED_JWT_FILER_SIGNING_KEY="$WEED_JWT_FILER_SIGNING_KEY" \
            chrislusf/seaweedfs:latest@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d \
            server -dir=/data -s3 -s3.port=8333 -volume.max=0 -master.volumeSizeLimitMB=1024
          for _ in $(seq 1 30); do
            if curl -s -o /dev/null http://127.0.0.1:8333/; then exit 0; fi
            sleep 2
          done
          echo "SeaweedFS no respondió en 60 s" >&2
          docker logs seaweedfs
          exit 1

      # Misma imagen de dbmate que docker-compose.yml (servicio migrate).
      - name: Aplicar migraciones
        run: |
          docker run --rm --network host \
            -v "${{ github.workspace }}/database/migrations:/db/migrations:ro" \
            -e DATABASE_URL="postgres://nexus_e2e:nexus_e2e@127.0.0.1:5432/nexus_e2e?sslmode=disable" \
            -e DBMATE_MIGRATIONS_DIR=/db/migrations \
            -e DBMATE_NO_DUMP_SCHEMA=true \
            ghcr.io/amacneil/dbmate:latest --no-dump-schema --wait up

      - name: Instalar dependencias
        working-directory: apps/api
        run: npm ci

      # --runInBand: las suites comparten la misma base; en serie evitamos interferencias entre ellas.
      - name: Ejecutar pruebas e2e
        working-directory: apps/api
        env:
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: "5432"
          POSTGRES_USER: nexus_e2e
          POSTGRES_PASSWORD: nexus_e2e
          POSTGRES_DB: nexus_e2e
          S3_ENDPOINT: 127.0.0.1
          S3_PORT: "8333"
          S3_USE_SSL: "false"
          S3_PUBLIC_ENDPOINT: http://127.0.0.1:8333
          S3_BUCKET: nexus-e2e
          WEB_URL: http://localhost:3000
        run: npm run test:e2e -- --runInBand
