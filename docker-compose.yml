services:
  postgres:
    image: postgres:16-alpine
    container_name: nexus-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexus_dev}
      POSTGRES_USER: ${POSTGRES_USER:-nexus_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_only_change_me}
    ports:
      - "5432:5432"
    volumes:
      - nexus-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexus_dev} -d ${POSTGRES_DB:-nexus_dev}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: pgsty/minio:latest
    container_name: nexus-minio-dev
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-nexus_local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-local_only_change_me_please}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - nexus-minio-data:/data

volumes:
  nexus-postgres-data:
  nexus-minio-data: