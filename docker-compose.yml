# ─────────────────────────────────────────────────────────────────────────────
# Nexus / PaaS — Docker Compose de desarrollo (unificado)
#
#   docker compose up -d                  → postgres + seaweedfs + mailpit
#   docker compose run --rm migrate       → aplica las migraciones (dbmate)
#   docker compose --profile containerized-api up -d --build   → además, la API en contenedor
#
# La API normalmente corre en el host (npm run dev:api) y se conecta a los puertos publicados.
# Todos los servicios comparten la red paas_backend: entre contenedores se llaman por nombre de servicio
# (postgres, seaweedfs, mailpit), no por localhost.
# ─────────────────────────────────────────────────────────────────────────────

networks:
  paas_backend:
    name: paas_backend

volumes:
  postgres_data:
  nexus-seaweedfs-data:

services:
  # ── Base de datos ─────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: paas_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexus_dev}
      POSTGRES_USER: ${POSTGRES_USER:-nexus_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_only_change_me}
    ports:
      # Solo para desarrollo.
      # Quitar este mapeo de puerto en producción; los servicios se conectan por la red interna.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - paas_backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexus_dev} -d ${POSTGRES_DB:-nexus_dev}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── Migraciones (se ejecutan a mano: docker compose run --rm migrate) ─────
  migrate:
    image: ghcr.io/amacneil/dbmate:latest
    container_name: paas_db_migrate
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-nexus_dev}:${POSTGRES_PASSWORD:-local_only_change_me}@postgres:5432/${POSTGRES_DB:-nexus_dev}?sslmode=disable
      DBMATE_MIGRATIONS_DIR: /db/migrations
      DBMATE_NO_DUMP_SCHEMA: "true"
    volumes:
      - ./database/migrations:/db/migrations:ro
    networks:
      - paas_backend
    command: ["--no-dump-schema", "--wait", "up"]

  # ── Almacenamiento de objetos ──────────────────────────────────────────────
  seaweedfs:
    image: chrislusf/seaweedfs:latest@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    container_name: nexus-seaweedfs-dev
    restart: unless-stopped
    command: server -dir=/data -s3 -s3.port=8333 -volume.max=0 -master.volumeSizeLimitMB=1024
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-nexus_local}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-local_only_change_me_please}
      WEED_JWT_FILER_SIGNING_KEY: ${S3_FILER_SIGNING_KEY:-local_dev_filer_signing_key_change_before_deploy}
    ports:
      # Solo para desarrollo
      - "8333:8333"
      - "9333:9333"
      - "8888:8888"
    volumes:
      - nexus-seaweedfs-data:/data
    networks:
      - paas_backend

  # ── Correo de desarrollo (NUEVO, para IAM: verificación de correo) ─────────
  # Recibe los correos de la API y los muestra en http://localhost:8025 (no envía nada a nadie).
  mailpit:
    image: axllent/mailpit:latest
    container_name: nexus-mailpit-dev
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP → MAIL_PORT
      - "8025:8025" # Interfaz web
    networks:
      - paas_backend

  # ── API (monolito modular NestJS) ─────────────────────────────────────────
  # Un único contenedor con todos los módulos: IAM, Billing, Files, Storage, Health.
  # El frontend Next.js corre como proceso independiente (npm run dev:web).
  api:
    profiles: ["containerized-api"]
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: nexus-api-dev
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: development
      API_PORT: 3001
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432 # puerto interno; POSTGRES_PORT del .env es solo el del host
      S3_ENDPOINT: seaweedfs
      S3_PORT: 8333
      S3_PUBLIC_ENDPOINT: http://localhost:8333
      S3_REGION: us-east-1
      S3_USE_SSL: "false"
      MAIL_HOST: mailpit # dentro de Docker, localhost no es Mailpit
      MAIL_PORT: 1025
    ports:
      - "3001:3001"
    networks:
      - paas_backend
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
